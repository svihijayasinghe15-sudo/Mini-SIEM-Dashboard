<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-SIEM SOC Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #1e293b;
            margin-bottom: 30px;
        }
        h1 {
            color: #f43f5e;
            margin: 0 0 10px 0;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
        }
        th, td {
            padding: 14px 20px;
            text-align: left;
        }
        th {
            background-color: #334155;
            color: #38bdf8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr {
            border-bottom: 1px solid #334155;
        }
        tr:hover {
            background-color: #475569;
        }
        .badge {
            background-color: #ef4444;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .ip-code {
            font-family: monospace;
            color: #fca5a5;
            background: #2e1065;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛡️ BlueTeam Mini-SIEM Dashboard</h1>
            <div class="subtitle">Security Operations Center (SOC) Live Incident Stream</div>
        </header>

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Source IP Address</th>
                    <th>Target User Account</th>
                    <th>Severity Rating</th>
                    <th>Incident Message</th>
                </tr>
            </thead>
            <tbody id="alert-rows">
                </tbody>
        </table>
    </div>

    <script>
        async function refreshDashboard() {
            try {
                // Fetch the latest list of alerts from our Python API
                const response = await fetch('/api/alerts');
                const alerts = await response.json();
                
                const tableBody = document.getElementById('alert-rows');
                tableBody.innerHTML = ''; // Clear old items
                
                // Reverse the array so the absolute newest alerts appear at the very top
                alerts.reverse().forEach(alert => {
                    const rowHtml = `
                        <tr>
                            <td>${alert.timestamp}</td>
                            <td><span class="ip-code">${alert.source_ip}</span></td>
                            <td><strong>${alert.target_user}</strong></td>
                            <td><span class="badge">${alert.severity}</span></td>
                            <td>${alert.message}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += rowHtml;
                });
            } catch (error) {
                console.error("Failed to sync data with SIEM backend API:", error);
            }
        }

        // Run the refresh function immediately when page loads
        refreshDashboard();
        // Keep checking the API backend every 3000 milliseconds (3 seconds)
        setInterval(refreshDashboard, 3000);
    </script>
</body>
</html>
